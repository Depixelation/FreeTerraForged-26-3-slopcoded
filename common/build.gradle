loom {
    accessWidenerPath = file("src/main/resources/freeterraforged.accesswidener")
}

dependencies {
    implementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    compileOnly files("${rootProject.projectDir}/libs/TerraBlender-fabric-26.3-26.3.0.0.9.jar")
    compileOnly "com.electronwill.night-config:toml:3.6.7"
    compileOnly files("${rootProject.projectDir}/libs/biolith-fabric-3.8.0-beta.2.jar")
    compileOnly files("${rootProject.projectDir}/libs/lithostitched-2.0.4-fabric-26.3.jar")
    compileOnly "dev.architectury:architectury-injectables:1.0.13"
    testImplementation "org.junit.jupiter:junit-jupiter:5.11.4"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.11.4"
}

repositories {
    mavenCentral()
    maven { url "https://api.modrinth.com/maven" }
}

processResources {
    filesMatching("pack.mcmeta") {
        expand project.properties
    }
}

test {
    useJUnitPlatform()
}
