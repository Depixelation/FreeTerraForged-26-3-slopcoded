evaluationDependsOn(":common")

loom {
    accessWidenerPath = project(":common").loom.accessWidenerPath

    mods {
        "freeterraforged" {
            sourceSet sourceSets.main
            sourceSet project(":common").sourceSets.main
        }
    }

    runs {
        benchmarkServer {
            server()
            name "Run Headless Worldgen Benchmark Server"
            runDir "build/benchmark-run"
            programArg "nogui"
            vmArg "-Xmx4G"
            vmArg "-Djava.awt.headless=true"
            vmArg "-Dfreeterraforged.benchmark.auto=true"
            vmArg "-Dfreeterraforged.benchmark.radius=${project.findProperty('ftfBenchmarkRadius') ?: '10'}"
            vmArg "-Dfreeterraforged.benchmark.x=${project.findProperty('ftfBenchmarkX') ?: '100000'}"
            vmArg "-Dfreeterraforged.benchmark.z=${project.findProperty('ftfBenchmarkZ') ?: '100000'}"
            vmArg "-Dfreeterraforged.benchmark.exit=true"
        }
        presetTestServer {
            server()
            name "Run Headless Preset Validation Server (Fabric)"
            runDir "build/preset-test-run"
            programArg "nogui"
            vmArg "-Xmx4G"
            vmArg "-Djava.awt.headless=true"
            vmArg "-Dfreeterraforged.test.preset=true"
            vmArg "-Dfreeterraforged.test.preset.exit=true"
            vmArg "-Dfreeterraforged.test.heightmap.dir=${project.rootDir.absolutePath.replace('\\', '/')}/build/reports/preset-test-heightmaps"
        }
    }
}

dependencies {
    implementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    if (file("${project.rootDir}/libs/fabric-api-26.3").exists()) {
        implementation fileTree(dir: "${project.rootDir}/libs/fabric-api-26.3", include: ["*.jar"])
    } else {
        modImplementation "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"
    }
    compileOnly files("${project.rootDir}/libs/biolith-fabric-3.8.0-beta.2.jar")
    compileOnly files("${project.rootDir}/libs/TerraBlender-fabric-26.3-26.3.0.0.9.jar")
    compileOnly files("${project.rootDir}/libs/lithostitched-2.0.4-fabric-26.3.jar")
    implementation(project(path: ":common")) { transitive = false }
}

tasks.register("prodServer", net.fabricmc.loom.task.prod.ServerProductionRunTask) {
    group = "fabric"
    description = "Runs the production artifact with Fabric's production server launcher"
    loaderVersion = rootProject.fabric_loader_version
    minecraftVersion = rootProject.minecraft_version
    runDir = file("run")
    jvmArgs.add("-Xmx4G")
}

repositories {
    maven { url "https://api.modrinth.com/maven" }
}

tasks.named("runBenchmarkServer").configure {
    doFirst {
        def benchDir = file("build/benchmark-run")
        delete(new File(benchDir, "world"))
        benchDir.mkdirs()
        new File(benchDir, "eula.txt").text = "eula=true\n"
        new File(benchDir, "server.properties").text = """\
level-type=freeterraforged\\:freeterraforged
level-seed=${project.findProperty('ftfBenchmarkSeed') ?: '-7442486958049957310'}
online-mode=false
spawn-protection=0
view-distance=10
simulation-distance=10
sync-chunk-writes=false
max-tick-time=-1
""".stripIndent()
    }
}

tasks.named("runPresetTestServer").configure {
    doFirst {
        def testDir = file("build/preset-test-run")
        delete(testDir)
        testDir.mkdirs()
        new File(testDir, "eula.txt").text = "eula=true\n"
        new File(testDir, "server.properties").text = """\
level-type=freeterraforged\\:freeterraforged
level-seed=${project.findProperty('ftfTestSeed') ?: '1337'}
online-mode=false
spawn-protection=0
view-distance=10
simulation-distance=10
sync-chunk-writes=false
max-tick-time=-1
""".stripIndent()
    }
}

tasks.register("runPresetTest") {
    group = "verification"
    description = "Runs the headless FreeTerraForged preset persistence and resolution tests"
    dependsOn(":common:test", "runPresetTestServer")
}

processResources {
    inputs.property "version", project.version
    from(project(":common").sourceSets.main.resources)
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

jar {
    dependsOn project(":common").tasks.named("classes")
    from(project(":common").sourceSets.main.output.classesDirs)
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    archiveClassifier.set("fabric-${rootProject.minecraft_version}")
}

sourcesJar {
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
